[project]
name = "project-iot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pillow>=10",  # generate_aruco_a4.py: xuất PDF đúng khổ A4 300 DPI
    "pygrabber>=0.2 ; sys_platform == 'win32'",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Chỉ chạy tests/
pythonpath = ["."]
testpaths = ["tests"]
